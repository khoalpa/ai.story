[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-studio"
version = "0.1.0"
description = "Unified Audio and Video studio tooling with CLI and Streamlit launchers."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "AI Audio & Video Studio" }
]
keywords = ["audio", "video", "streamlit", "tts", "ffmpeg"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Video",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "PyYAML==6.0.3",
  "edge-tts==7.2.7",
  "vieneu>=3.2.4,<4",
  "neucodec>=0.0.5",
  "streamlit>=1.49,<2",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.10,<2",
  "wheel>=0.42,<1",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.10,<2",
  "wheel>=0.42,<1",
]
all = []

[project.urls]
Homepage = "https://www.pythonanywhere.com/user/khoalpa/ai-studio"
Documentation = "https://www.pythonanywhere.com/user/khoalpa/ai-studio/docs"

[project.scripts]
render-audio = "audio.entrypoints:main"
render-audio-gui = "audio.gui_entry:main"
render-video = "video.cli:main"
render-video-gui = "video.gui_entry:main"
ai-studio-gui = "studio.gui_entry:main"
ai-story-audit = "studio.prompt_audit:main"


[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
audio = [
  "py.typed",
  "assets/*",
  "assets/*/*",
  "assets/*/*/*",
  "assets/*/*/*/*",
]
"video" = [
  "assets/*",
  "assets/*/*",
  "assets/*/*/*",
  "assets/*/*/*/*",
]

[tool.setuptools.packages.find]
include = ["audio*", "video*", "studio*"]
exclude = [
  "tests*",
  "dist*",
  "build*",
  "audio.models",
  "audio.models.*",
  "*.local_models",
  "*.local_models.*",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["audio", "video", "studio"]

[tool.coverage.report]
fail_under = 45
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]


[tool.ruff]
target-version = "py310"
exclude = [
  ".venv",
  "build",
  "dist",
  "*.egg-info",
  "audio/models",
  "*/local_models",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"audio/__init__.py" = ["E402"]
"audio/make_audio_edge_tts.py" = ["E402"]
"audio/tts_provider.py" = ["F401"]
"audio/adapters/ffmpeg_audio_mixer.py" = ["F401"]
"audio/gui/settings.py" = ["F401"]
"video/app_api.py" = ["E402"]
"video/gui/service.py" = ["E402"]
"video/make_video_from_audio.py" = ["E402"]
"scripts/clean_project.py" = ["E402"]
"scripts/manage_models.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
no_site_packages = true
# Run mypy across the shipped packages so new modules are type-checked by default.
# Modules listed in the override below are the current type-debt baseline and
# should be removed from that list as they are cleaned up.
files = [
  "audio",
  "video",
  "studio",
  "scripts",
]
ignore_missing_imports = true
follow_imports = "silent"
exclude = [
  '(^|/)build/',
  '(^|/)dist/',
  '\.egg-info/',
  '(^|/)audio/models/',
  '(^|/)[^/]+/local_models/',
]

[[tool.mypy.overrides]]
# Baseline of modules with known mypy debt. Keep this list explicit so CI still
# covers the rest of the package tree and new modules do not silently opt out.
module = [
  "audio.adapters.edge_tts",
  "audio.adapters.ffmpeg_audio_mixer",
  "audio.adapters.tts_core",
  "audio.gui.app",
  "audio.gui.batch",
  "audio.gui.helpers",
  "audio.gui.run_panel",
  "audio.gui.service",
  "audio.gui.settings",
  "audio.gui.shell",
  "audio.gui.workspace_state",
  "audio.pipeline.segment_planner",
  "audio.profile_manifest_schema",
  "audio.render_batch_manifest",
  "audio.render_batch_runner",
  "audio.render_job_store",
  "audio.services.tts_render",
  "audio.validate_plain_script",
  "video.app_api",
  "video.gui.shared_state",
  "video.render_slideshow",
  "video.cli_entry",
  "video.ffmpeg_runner",
  "video.gui.tabs",
]
ignore_errors = true
