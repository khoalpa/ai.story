[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-studio-shell"
version = "0.1.0"
description = "Integrated shell for the standalone Audio and Video packages."
license = {text = "MIT"}
authors = [{name = "AI Audio & Video Studio"}]
requires-python = ">=3.10,<3.13"
dependencies = ["ai-audio>=0.1,<0.2", "ai-video>=0.1,<0.2", "streamlit>=1.49,<2"]

[project.scripts]
ai-studio-gui = "studio.gui_entry:main"

[tool.setuptools]
package-dir = {"" = "../.."}

[tool.setuptools.packages.find]
where = ["../.."]
include = ["studio*"]
