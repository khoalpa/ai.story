[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-studio-shell"
version = "0.1.0"
description = "Integrated shell for the standalone Audio and Video packages."
license = {text = "MIT"}
authors = [{name = "AI Audio & Video Studio"}]
requires-python = ">=3.10,<3.13"
dependencies = ["ai-audio>=0.1,<0.2", "ai-video>=0.1,<0.2", "streamlit>=1.49,<2", "pypdf>=6.21,<7"]

[project.scripts]
ai-studio-gui = "studio.gui_entry:main"
ai-story-audit = "studio.prompt_audit:main"
ai-summary-build = "studio.summary_cli:build_main"
ai-summary-project = "studio.summary_cli:project_main"
ai-summary-audit = "studio.summary_cli:audit_main"
ai-summary-migrate = "studio.summary_cli:migrate_main"

[tool.setuptools]
package-dir = {"" = "../.."}
include-package-data = true

[tool.setuptools.package-data]
studio = ["themes/*.json"]

[tool.setuptools.data-files]
"share/ai-story/prompts" = ["../../prompts/story_prompt_v4.1.6.txt", "../../prompts/story_prompt_v4.2.0.txt", "../../prompts/story_prompt_v5.2.0.txt", "../../prompts/story_prompt_v5.2.2.txt", "../../prompts/story_prompt_v5.2.2_quickstart.txt", "../../prompts/summary_prompt_v1.4.0.txt"]
"share/ai-story/releases/v5.2.2-r3" = ["../../docs/releases/v5.2.2-r3/release_policy_v5.2.2_r3.json", "../../docs/releases/v5.2.2-r3/Bao_cao_Prompt_v5.2.2_r3.md"]

[tool.setuptools.packages.find]
where = ["../.."]
include = ["studio*"]
